<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pass Predictor</title>
<link rel="stylesheet" href="person4-ui/style.css">
</head>
<body>

<h1>Pass Predictor</h1>

<div class="layout">
  <div class="panel">
    <label>Study hours: <span id="studyVal">5</span></label>
    <input type="range" id="studySlider" min="0" max="10" value="5"
      oninput="document.getElementById('studyVal').textContent=this.value">
    <label>Sleep hours: <span id="sleepVal">5</span></label>
    <input type="range" id="sleepSlider" min="0" max="10" value="5"
      oninput="document.getElementById('sleepVal').textContent=this.value">
    <button id="trainBtn">Train Network</button>
    <p id="status">Untrained</p>
    <h2 id="predPct">--%</h2>
  </div>

  <div class="panel">
    <h3>Network</h3>
    <canvas id="network" width="380" height="300"></canvas>
  </div>

  <div class="panel">
    <h3>Loss</h3>
    <canvas id="lossChart" width="380" height="300"></canvas>
  </div>
</div>

<script src="person1-math/math-core.js"></script>
<script src="person2-training/train.js"></script>
<script src="person3-diagram/diagram.js"></script>
<script src="person4-ui/ui.js"></script>

</body>
</html>
